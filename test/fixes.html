<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test corectii ANAF</title>
<link rel="stylesheet" href="../styles/main.css">
<style>
  body { padding: 24px; max-width: 1100px; margin: 0 auto; }
  #test-results { font-family: monospace; font-size: 13px; }
  .test-pass { color: var(--success); padding: 2px 0; }
  .test-fail { color: var(--danger); padding: 2px 0; font-weight: 600; }
  iframe { width: 100%; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<h1>Corectii ANAF (0.9-beta-18/19)</h1>
<p>Protejeaza corectiile: CUI fara RO cu TVA (BT-32), pret negativ mutat pe cantitate (BR-27),
   cote implicite, data tastata, incarcare ZIP, reguli BR-27 / BR-S-02 / BR-O-11.</p>

<iframe id="editor" src="../index.html"></iframe>

<script type="module">
import { test, assertEqual, assertTrue, report } from './assert.js';
import JSZip from '../js/vendor/jszip.mjs';
import { BR_RULES } from '../js/validation/br-ro.js';

const FIXTURE = 'fixtures/cui_fara_ro_storno_tva21.xml';
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

const editor = document.getElementById('editor');
await new Promise((resolve) => {
    if (editor.contentDocument && editor.contentDocument.readyState === 'complete') resolve();
    else editor.addEventListener('load', () => resolve(), { once: true });
});
await sleep(300);
const win = editor.contentWindow;
const doc = editor.contentDocument;
const q = (sel) => doc.querySelector(sel);

async function loadFile(name, data, type) {
    const dt = new (win.DataTransfer)();
    dt.items.add(new (win.File)([data], name, { type }));
    const input = doc.getElementById('fileInput');
    input.files = dt.files;
    input.dispatchEvent(new Event('change', { bubbles: true }));
    await sleep(600);
}

function savedXmlDoc() {
    const orig = win.URL.createObjectURL;
    let blob = null;
    win.URL.createObjectURL = (b) => { blob = b; return 'blob:capture'; };
    try { win.saveXML(); } finally { win.URL.createObjectURL = orig; }
    return blob;
}

async function savedXml() {
    const blob = savedXmlDoc();
    const text = blob ? await blob.text() : '';
    return new DOMParser().parseFromString(text, 'text/xml');
}

const NS_CBC = 'urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2';
const NS_CAC = 'urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2';
const cac = (el, n) => [...el.getElementsByTagNameNS(NS_CAC, n)];
const cbc = (el, n) => [...el.getElementsByTagNameNS(NS_CBC, n)];
const txt = (el, n) => (cbc(el, n)[0] || {}).textContent;
const totalText = () => (doc.getElementById('total').textContent || '').replace(/\s/g, '');

const fixtureXml = await (await fetch(FIXTURE)).text();

// 1. Incarcare din ZIP (ca arhiva ANAF / descarcarea din alte surse)
{
    const zip = new JSZip();
    zip.file('factura.xml', fixtureXml);
    zip.file('semnatura_factura.xml', '<Signature/>');
    const blob = await zip.generateAsync({ type: 'blob' });
    await loadFile('factura.zip', blob, 'application/zip');
    test('ZIP: se incarca factura, nu semnatura (2 linii)', () =>
        assertEqual(doc.querySelectorAll('.line-item').length, 2));
    test('ZIP: totalul este 209405.71', () => assertEqual(totalText(), '209405.71'));
}

// 2. XML simplu + round-trip
await loadFile('factura.xml', fixtureXml, 'application/xml');
test('XML: 2 linii, total 209405.71', () => {
    assertEqual(doc.querySelectorAll('.line-item').length, 2);
    assertEqual(totalText(), '209405.71');
});
test('Data emiterii nu e inversata la incarcare (05.11.2026)', () =>
    assertEqual(q('[name="issueDate"]').value, '05.11.2026'));
test('CUI fara RO: linia cu TVA ramane S 21% (nu e fortata pe O)', () => {
    assertEqual(q('[name="vatType1"]').value, 'S');
    assertEqual(q('[name="vatRate1"]').dataset.raw.replace(/\.0+$/, ''), '21');
    assertTrue(!q('[name="vatType1"]').disabled, 'categoria TVA e blocata');
});
{
    const x = await savedXml();
    const supplier = cac(x, 'AccountingSupplierParty')[0];
    const pts = supplier ? cac(supplier, 'PartyTaxScheme')[0] : null;
    test('BT-32: furnizor fara RO are PartyTaxScheme/CompanyID = CUI', () => {
        assertTrue(!!pts, 'lipseste PartyTaxScheme la furnizor');
        assertEqual(txt(pts, 'CompanyID'), '12345674');
    });
    test('BT-32: TaxScheme fara ID VAT la CUI fara RO', () => {
        const ts = cac(pts, 'TaxScheme')[0];
        assertTrue(!!ts, 'lipseste TaxScheme');
        assertEqual(cbc(ts, 'ID').length, 0, 'TaxScheme nu trebuie sa aiba ID');
    });
    test('Round-trip: storno pe cantitate, pret pozitiv', () => {
        const line = cac(x, 'InvoiceLine')[0];
        assertTrue(Number(txt(line, 'InvoicedQuantity')) < 0, 'cantitatea nu e negativa');
        assertTrue(Number(txt(cac(line, 'Price')[0], 'PriceAmount')) > 0, 'pretul nu e pozitiv');
    });
    test('Round-trip: PayableAmount = 209405.71', () =>
        assertEqual(txt(cac(x, 'LegalMonetaryTotal')[0], 'PayableAmount'), '209405.71'));
    test('Round-trip: IssueDate = 2026-11-05', () => assertEqual(txt(x.documentElement, 'IssueDate'), '2026-11-05'));
}

// 3. Data tastata manual nu se inverseaza (Pikaday DD.MM)
{
    const d = q('[name="issueDate"]');
    d.value = '03.12.2026';
    d.dispatchEvent(new Event('input', { bubbles: true }));
    d.dispatchEvent(new Event('change', { bubbles: true }));
    d.dispatchEvent(new Event('blur'));
    await sleep(200);
    test('Data tastata 03.12.2026 ramane 03.12.2026', () => assertEqual(d.value, '03.12.2026'));
}

// 4. Pret negativ -> cantitate negativa
{
    const p = q('[name="price1"]');
    const qty = q('[name="quantity1"]');
    p.value = '-100';
    p.dispatchEvent(new Event('change', { bubbles: true }));
    await sleep(200);
    test('Pret negativ: pretul devine pozitiv', () => assertEqual(Number(p.dataset.raw), 100));
    test('Pret negativ: cantitatea devine negativa', () => assertEqual(Number(qty.dataset.raw), -1));
}

// 5. Cote implicite pe linie noua
{
    const vat = q('[name="supplierVAT"]');
    vat.value = '12345674';
    vat.dispatchEvent(new Event('change', { bubbles: true }));
    win.addLineItem();
    await sleep(100);
    let i = doc.querySelectorAll('.line-item').length - 1;
    test('Linie noua, furnizor fara RO: O / 0%', () => {
        assertEqual(q(`[name="vatType${i}"]`).value, 'O');
        assertEqual(Number(q(`[name="vatRate${i}"]`).dataset.raw || q(`[name="vatRate${i}"]`).value), 0);
    });
    const sel = q(`[name="vatType${i}"]`);
    sel.value = 'S';
    win.handleVatTypeChange(i);
    test('Furnizor fara RO: categoria se poate schimba pe S, cota 21', () => {
        assertTrue(!sel.disabled, 'categoria e blocata');
        assertEqual(Number(q(`[name="vatRate${i}"]`).dataset.raw), 21);
    });
    vat.value = 'RO12345674';
    vat.dispatchEvent(new Event('change', { bubbles: true }));
    win.addLineItem();
    await sleep(100);
    i = doc.querySelectorAll('.line-item').length - 1;
    test('Linie noua, furnizor cu RO: S / 21%', () => {
        assertEqual(q(`[name="vatType${i}"]`).value, 'S');
        assertEqual(Number(q(`[name="vatRate${i}"]`).dataset.raw || q(`[name="vatRate${i}"]`).value), 21);
    });
}

// 6. Reguli BR (fara UI)
const rule = (code) => BR_RULES.find(r => r.code === code);
const li = (o) => ({ index: 0, unitPrice: '10', vatType: 'S', ...o });
test('BR-27: pret negativ e eroare', () => {
    assertTrue(!!rule('BR-27'), 'regula lipseste');
    assertEqual(rule('BR-27').check({ lineItems: [li({ unitPrice: '-5' })] }), false);
    assertEqual(rule('BR-27').check({ lineItems: [li({})] }), true);
});
test('BR-S-02: linie S fara cod fiscal furnizor e eroare; CUI fara RO e suficient', () => {
    assertEqual(rule('BR-S-02').check({ lineItems: [li({})], supplierVAT: '' }), false);
    assertEqual(rule('BR-S-02').check({ lineItems: [li({})], supplierVAT: '12345674' }), true);
});
test('BR-O-11: O amestecat cu S e eroare', () => {
    assertEqual(rule('BR-O-11').check({ lineItems: [li({ vatType: 'O' }), li({})] }), false);
    assertEqual(rule('BR-O-11').check({ lineItems: [li({ vatType: 'O' }), li({ vatType: 'O' })] }), true);
});

window.__testResult = report();
</script>
</body>
</html>
